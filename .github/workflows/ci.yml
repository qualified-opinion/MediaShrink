name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 ffmpeg libvips42 libheif-plugin-x265 libheif-plugin-libde265
      - name: Install application and build tool
        run: python -m pip install '.[photos]' build
      - name: Run headless startup check
        run: python -m unittest discover -s tests -v
      - name: Build source and wheel distributions
        run: python -m build
      - name: Upload Python packages
        uses: actions/upload-artifact@v4
        with:
          name: mediashrink-python-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
  arch-package:
    # Builds and installs the Arch/Omarchy package exactly as users do (makepkg, pacman -U).
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools and package dependencies
        run: pacman -Syu --noconfirm --needed base-devel git python pyside6 python-pyvips libvips libheif ffmpeg python-build python-installer python-setuptools python-wheel desktop-file-utils
      - uses: actions/checkout@v4
      - name: Build package (makepkg refuses to run as root)
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm"
      - name: Install package and smoke-test the installed app
        run: |
          pacman -U --noconfirm packaging/arch/mediashrink-*.pkg.tar.zst
          desktop-file-validate /usr/share/applications/mediashrink.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/mediashrink.svg
          test "$(command -v mediashrink)" = /usr/bin/mediashrink
          cd /
          QT_QPA_PLATFORM=offscreen python -c "from PySide6.QtWidgets import QApplication; from mediashrink.app import MainWindow; app = QApplication([]); w = MainWindow(); w.show(); app.processEvents(); print('window ok')"
          python -c "import pyvips; pyvips.Image.black(16, 16, bands=3).heifsave_buffer(compression='hevc'); print('HEIC encoder available')" || echo "::warning::Arch libheif has no HEVC encoder; HEIC photos will be reported as skipped"
          ffmpeg -hide_banner -encoders | grep -E 'libx264|libx265|nvenc'
      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: mediashrink-arch-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
