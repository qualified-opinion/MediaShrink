[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediashrink"
version = "0.1.0.dev1"
description = "Offline photo and video compression for Linux"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.gui-scripts]
mediashrink = "mediashrink.app:main"

[tool.setuptools.packages.find]
where = ["src"]
